name: Build iOS IPA (Dino English)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Native iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify Project Structure
        run: |
          cd iOS
          xcodebuild -list -project DinoEnglish.xcodeproj

      - name: Compile Native iOS App
        run: |
          cd iOS
          mkdir -p build_output
          xcodebuild clean build \
            -project DinoEnglish.xcodeproj \
            -target DinoEnglish \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          cd iOS
          mkdir -p ipa_package/Payload
          APP_PATH=$(find build_output -name "DinoEnglish.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" ipa_package/Payload/
          cd ipa_package
          zip -qr ../DinoEnglish.ipa Payload
          cd ..
          echo "DinoEnglish.ipa successfully created!"
          ls -lh DinoEnglish.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinoEnglish-iOS-IPA
          path: iOS/DinoEnglish.ipa
          retention-days: 14
