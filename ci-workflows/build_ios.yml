name: Build iOS IPA (Dino English)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Native iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Verify Project Structure
        run: |
          cd iOS
          xcodebuild -list -project DinoEnglish.xcodeproj

      - name: Compile Native iOS App
        run: |
          cd iOS
          mkdir -p build_output
          set +e
          xcodebuild clean build \
            -project DinoEnglish.xcodeproj \
            -scheme DinoEnglish \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "### ❌ Xcode Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -C 2 -E "error:|fatal:" xcodebuild.log | head -n 60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "=== FULL ERROR LOG ==="
            tail -n 100 xcodebuild.log
            exit $BUILD_STATUS
          fi
          set -e

      - name: Package .ipa
        run: |
          cd iOS
          mkdir -p ipa_package/Payload
          APP_PATH=$(find build_output -name "DinoEnglish.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" ipa_package/Payload/
          cd ipa_package
          zip -qr ../DinoEnglish.ipa Payload
          cd ..
          echo "DinoEnglish.ipa successfully created!"
          ls -lh DinoEnglish.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinoEnglish-iOS-IPA
          path: iOS/DinoEnglish.ipa
          retention-days: 14
